name: Publish Sneeai Agent

on:
  push:
    branches:
      - main
    paths:
      - "canvas-agent/**"
      - ".github/workflows/publish-canvas-agent.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sneeai-agent
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canvas-agent

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install current npm
        run: npm install --global npm@^11.12.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Agent
        run: npm run typecheck && npm test && npm run build

      - name: Check package version
        id: package
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$published" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.package.outputs.should_publish == 'true'
        run: npm publish --access public

      - name: Skip existing version
        if: steps.package.outputs.should_publish != 'true'
        run: echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} already exists on npm, skipping publish."
